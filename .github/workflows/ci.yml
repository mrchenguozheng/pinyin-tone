name: CI

on:
  push:
    branches:
      - master
      - 'release/3.0'
  pull_request:

# 这个 workflow 只读仓库：它不提交任何东西，权限给到最小。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # mocha 11 要求 ^18.18 || ^20.9 || >=21.1，chai 6 要求 >=18，
        # 因此 20 是下界，24 是当前 LTS 之上的一档。
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # package.json 的 test = mocha && tsc --noEmit：
      # 行为靠 mocha，类型层（d.ts 与 fixture）靠 tsc。
      # pretest 会先跑 `build-cjs.mjs --check`：dist/index.cjs 与 lib/ 不同步就直接红，
      # 于是 test-cjs.js 里那份「CJS 与 ESM 输出逐条相同」对拍不会被过期产物骗过。
      - run: npm test

  engines:
    name: engines floor (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines 声明的是 >=14。矩阵压在这个下界上：14 是能跑的最低版本，
        # 18 是「require() 能读 ESM 之前」的最后一个大版本（18.19 才开始支持）。
        # 不装 devDependencies —— mocha 11 / chai 6 在 14 上装不上，
        # 而这一步要证明的只是「包本身在这个 Node 上能用」，与测试框架无关。
        node: ['14', '18']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 打包 → 装进一个干净工程 → 让真实的 Node 分别走 require 与 import 两个条件。
      - run: node scripts/smoke-entry.cjs

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 守卫：CONTRIBUTORS.svg（455KB 内嵌头像）曾被打进 tarball，
      # 占包体 3/4。这里把「包里有什么、有多大」变成一条会红的断言。
      # prepack 会先校验 dist/index.cjs 是否与 lib/ 同步。
      - run: npm run pack:check
