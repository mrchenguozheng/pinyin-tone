name: Publish

# 发版只认 tag：v3.0.1 这样的轻重标签推上来，这个 workflow 才动 npm。
# 本仓库的历史就是这样发的（21 个 v* tag），所以 tag 是唯一可信的发布意图；
# 分支上的普通提交不触发，避免「合进 master 就上线」这种没人能审计的路径。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只做 npm stage publish --dry-run，不真的进 staging 区'
        type: boolean
        default: true

# contents: read 够读代码；id-token: write 是 provenance 与 npm Trusted Publishing 的前提，
# 有了它发布的包会带上「由这个 workflow、这个 commit 构建」的可验证来源，且不需要长期 token。
permissions:
  contents: read
  id-token: write

# 发布必须串行：两次 publish 并发会一个成功一个 409，而且谁都说不清最终是哪份。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    # 发布前必须有人点一次批准。这个 environment 的 required reviewers 在仓库设置里配
    # （Settings → Environments → npm-publish → Required reviewers），配好之后推 tag 只会把这次
    # 运行排进「等待批准」，不会直接发。没有保护规则的 environment 等同于不存在，所以这一步
    # 必须人工配置 —— 它和闸里那条「必须是 annotated tag」是一对：一个要人手点，一个要多敲一个 -a。
    environment:
      name: npm-publish
    # 固定镜像而不是 ubuntu-latest：发布是唯一的、不可回滚的动作，让一个会自己迁移的平台
    # 决定某次发布的行为没有意义。
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          # 要判断 tag 指向的提交是否落在发布分支上，必须拿到完整历史与远端分支。
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          # 不传 registry-url：setup-node 会顺手写一条 always-auth 到 .npmrc，npm 从 11 起对这条
          # 旧配置发警告，而 npm 的默认 registry 本来就是 registry.npmjs.org —— 不需要额外设置。

      # 发布用 npm 的 staged publishing（本仓库的 trust relationship 权限是 npm stage publish，
      # 直接 npm publish 会被 registry 拒绝），而 staged publishing 要求 npm >= 11.15.0、Node >= 22.14。
      # 所以这里装一个「11 大版本、且不低于 11.15」的 npm：既满足 staged 的下界，也不跨到 12 ——
      # npm 12 把 `npm pack --json` 的输出从数组改成以包名为键的对象（实测 11.21.2 数组、12.2.2 对象），
      # 第一次发布就是被这个差异打穿的。换范围时要连同 scripts/pack-json.mjs 与 test/test-pack-json.js 一起确认。
      - run: npm install -g "npm@>=11.15.0 <12"

      - run: npm ci

      # 发布前重跑测试。tag 推送不会触发 ci.yml（它只听 master / release 分支与 PR），
      # 所以这里必须自己把关：否则一个跳过 CI 的 tag 就能把未验证的代码发出去。
      - run: npm test

      # 包里有什么、有多大。prepack 会先校验 dist/index.cjs 与 lib/ 同步。
      - run: npm run pack:check

      # 三道闸，都在真正 publish 之前。任何一道不过就退出，不碰 registry。
      - name: 校验 tag、分支与 dist-tag
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          REF=${GITHUB_REF_NAME}
          DRY=${{ inputs.dry_run }}

          # 真发布只能从 tag 出发。手动触发时如果当前 ref 是分支，只允许排练：
          # 没有 tag 的发布在仓库里留不下「发过什么」的记录，provenance 也会指向一个分支。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # 轻量 tag 只需 `git tag v3.0.2` 一条命令，`git push --tags` 又会把本地所有 tag 一起送上来
            # —— 一次手滑就能触发真发布。annotated tag 至少要多敲一次 `-a -m`，并留下打 tag 的时间
            # 与说明，所以真发布只认 annotated tag。
            if [ "$(git cat-file -t "${REF}" 2>/dev/null || echo missing)" != "tag" ]; then
              echo "tag ${REF} 不是 annotated tag：真发布要求 git tag -a ${REF} -m \"...\"" >&2
              exit 1
            fi
            if [ "${REF}" = "v${VERSION}" ]; then
              echo "tag ${REF} 与 package.json 的 ${VERSION} 一致"
            else
              echo "tag ${REF} 与 package.json 的 ${VERSION} 不一致：先改 package.json 再打 tag" >&2
              exit 1
            fi
          elif [ "${DRY}" = "true" ]; then
            echo "当前 ref 是 ${REF}，不是 tag：按排练处理，只做 dry run"
          else
            echo "真发布必须从 tag 触发：当前 ref 是 ${REF}" >&2
            exit 1
          fi

          # 两条线各有自己的 dist-tag：3.x 发 latest，2.x 只发 legacy。
          # 让 2.x 去发 latest 会把所有默认安装的用户从 3.0 拽回 2.5，这是本仓库最不该发生的意外。
          MAJOR=${VERSION%%.*}
          if [ "${MAJOR}" = "2" ]; then
            TAG=legacy
            BRANCH=maintain/2.x
          else
            TAG=latest
            BRANCH=master
          fi
          echo "dist-tag=${TAG}，要求提交在 ${BRANCH} 上"

          git fetch --no-tags origin "${BRANCH}"
          if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${BRANCH}"; then
            echo "提交在 ${BRANCH} 的历史里"
          else
            echo "${GITHUB_SHA} 不在 origin/${BRANCH} 上：从别的分支发版会绕过该分支的 CI" >&2
            exit 1
          fi

          # 版本不可覆盖：registry 上已有同号版本就不能再发。但排练不碰 registry，
          # 而且排练存在的意义恰恰是「这一版已经发出去了、下一版还没升」的那个状态 ——
          # 所以排练只警告，真发布才退出。
          if npm view "pinyin-tone@${VERSION}" version >/dev/null 2>&1; then
            if [ "${DRY}" = "true" ]; then
              echo "pinyin-tone@${VERSION} 已在 registry 上：演练继续；真发布会被这一步拦下，真发前先升版本"
            else
              echo "pinyin-tone@${VERSION} 已在 registry 上：版本号不能覆盖，请先升版本" >&2
              exit 1
            fi
          fi

          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      # 认证方式的预检。仓库里不存任何 npm 凭据，唯一来源是 OIDC：本次运行向 npm 换一枚短期 token，
      # 前提是 npm 包设置里登记了这个仓库与 workflow（已登记，权限 npm stage publish）。
      # 缺 OIDC 时 npm 只会回一个含糊的报错，所以这里提前说清缺的是什么。
      - name: 确认认证方式
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "没有 OIDC 环境变量：job 的 permissions 里缺 id-token: write，或 workflow 不是由本仓库触发" >&2
            exit 1
          fi
          echo "OIDC 可用：按 Trusted Publishing 认证（npm 侧已登记 mrchenguozheng/pinyin-tone + publish.yml，权限 npm stage publish）"

      # 排练路径：workflow_dispatch 默认 dry_run=true，跑完全部校验后只打印会发什么。
      # 在分支上触发时这是唯一允许的动作。
      - name: 发布（dry run）
        if: inputs.dry_run == true
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # staged 与已发布版本共用同一个版本号唯一索引，dry run 也会查它，所以拿一个已经发过
          # 的版本排练，npm 自己会拒绝（cannot publish over the previously published versions）。
          # 排练要看的是机制：认证、文件清单、dist-tag、--provenance 是否被接受。版本已经存在时
          # 换成不会存在的 0.0.0-rehearsal 再跑；只改工作副本，不提交、不打 tag。
          if npm view "pinyin-tone@${VERSION}" version >/dev/null 2>&1; then
            echo "版本 ${VERSION} 已在 registry：排练改用 0.0.0-rehearsal（npm 不接受重复版本）"
            npm pkg set version=0.0.0-rehearsal
          fi
          npm stage publish --dry-run --tag "$TAG"

      # 暂存，不是上线：本仓库的 trust relationship 只给了 npm stage publish，所以这里用的是
      # `npm stage publish` —— 包进 staging 区，registry 上仍看不到。要真正上架，需要一个维护者
      # 在 npmjs.com 的 Staged Packages 里点 Approve（或在本地 `npm stage approve <stage-id>`），
      # 那一步强制 2FA。staged 版本与已发布版本共用同一个版本号唯一索引，所以「忘批准」的后果是
      # 同名版本既没上架也不能再 stage，得先 `npm stage reject`。
      - name: 发布
        if: inputs.dry_run != true
        run: npm stage publish --tag "$TAG" --provenance --access public
